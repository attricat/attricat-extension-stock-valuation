[package]
name = "attricat-stock-valuation-server"
version = "0.1.0"
license = "MIT"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
attricat-stock-valuation-core = { path = "../valuation-core" }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.57.1"
